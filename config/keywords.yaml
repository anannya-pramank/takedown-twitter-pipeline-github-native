# Queries run against `twitter search`. Keep this list short — each query is
# a separate call, and search is the least stable twitter-cli command.
# Start narrow, widen once you see what fires.
queries:
  - "\"Section 69A\" (\"IT Act\" OR MeitY OR blocked OR blocking OR withheld OR takedown) -\"income tax\" -ITAT -\"unexplained money\" -GST"
  - "\"Section 79 IT Act\""
  - "MeitY blocking order"
  - "\"MeitY advisory\" (intermediary OR platform OR takedown OR misinformation OR deepfake OR content) -startup -manufacturing -incentive"
  - "IT Rules 2021 takedown"
  - "\"IT Rules\" (Amendment OR \"Second Amendment\") 2026 -\"Mines and Minerals\" -\"Companies Act\""
  - "Digital India Act"
  - "content blocked India government"
  - "website blocked India court order"
  - "URL blocking order India"
  - "DNS blocking India"
  - "ISP blocking order India"
  - "account withheld India"
  - "X Corp withheld India"
  - "internet shutdown order India"
  - "app banned India government"
  - "\"national security\" app banned India MeitY"
  - "VPN banned India"
  # The six queries below fill gaps identified directly from SFLC.IN's
  # documented blocking-order dataset — these categories together account
  # for the large majority of real blocking activity but had zero targeted
  # coverage before: piracy/copyright (Delhi HC), police-ordered account
  # withholding for public order (a structurally different category from
  # MeitY/political blocking), illegal betting, obscenity, and defamation.
  - "\"Delhi High Court\" piracy website blocked India"
  - "(\"Kerala Police\" OR \"Telangana Police\" OR \"Tamil Nadu Police\") Twitter account withheld"
  - "illegal betting website blocked India police"
  - "\"Ministry of Information\" app banned obscene India"
  - "tweet taken down India defamation court order"
  - "\"compliance report\" (MeitY OR \"IT Rules\" OR intermediary OR Meta OR Google OR YouTube OR Instagram OR X.com)"
  - "\"grievance officer\" (\"IT Rules\" OR MeitY OR takedown OR blocking OR intermediary) -refund -delivery -order#"
  - "Grievance Appellate Committee order"
  - "\"sealed cover\" (MeitY OR \"IT Rules\" OR blocking OR intermediary OR India)"
  - "intermediary liability India order"
  - "safe harbour India court"
  - "deepfake takedown order India"
  - "fact check unit order"
  # Weak signal in practice — mostly generic privacy/political commentary,
  # not actual DPDP-driven takedowns. Consider dropping or reframing around
  # what you're actually trying to catch here (data-protection-order-driven
  # removal is real but rare; the current phrasing doesn't find it).
  - "DPDP Act takedown"
  # Same — mostly generic political noise reusing "Election Commission" and
  # "content" separately rather than describing an actual EC-ordered removal.
  - "election commission content removal India"
  # Was returning only generic telecom/airline customer-service auto-replies
  # that don't mention satellite broadband at all — narrowed to the actual
  # providers this is meant to track.
  - "(Starlink OR \"JioSpaceFiber\" OR OneWeb) (blocked OR banned OR restricted OR license) India"
  - "OTT platform blocked India"
  - "press freedom takedown India"
  - "journalist account blocked India"

# Timelines pulled with `twitter user-posts` instead — more stable than
# search per Agent Reach's own docs, so this is the backbone, not the extra.
handles:
  - "IFF_India"        # Internet Freedom Foundation — tracks takedowns directly
  - "medianama"         # India tech policy news
  - "meityGoI"
  - "SFLCin"             # Software Freedom Law Center India — legal tracking
  - "internetfreedom"     # IFF's secondary/legacy handle, kept for coverage
  - "editorsguildindia"    # press-freedom angle on takedowns
  - "PUCLIndia"             # civil liberties org, occasionally flags orders
  - "Entrackr"               # India tech/policy news, covers compliance reports
  - "digitalfront_"           # digital rights commentary, India-focused

# Results per call. Keep low — this is a monitoring feed, not bulk collection,
# and every extra tweet is more proxy bandwidth + more relevance-gate calls.
results_per_query: 15
results_per_handle: 20
