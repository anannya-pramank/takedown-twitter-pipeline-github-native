# Queries run against `twitter search`. Keep this list short — each query is
# a separate call, and search is the least stable twitter-cli command.
# Start narrow, widen once you see what fires.
queries:
  - "Section 69A"
  - "Section 79 IT Act"
  - "MeitY blocking order"
  - "MeitY advisory"
  - "IT Rules 2021 takedown"
  - "IT Rules Amendment 2026"
  - "Digital India Act"
  - "content blocked India government"
  - "website blocked India court order"
  - "URL blocking order India"
  - "DNS blocking India"
  - "ISP blocking order India"
  - "account withheld India"
  - "X Corp withheld India"
  - "internet shutdown order India"
  - "app banned India government"
  - "VPN banned India"
  - "compliance report IT Rules"
  - "grievance officer order India"
  - "Grievance Appellate Committee order"
  - "sealed cover order IT Rules"
  - "intermediary liability India order"
  - "safe harbour India court"
